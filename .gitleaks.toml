# Gitleaks configuration
# https://github.com/gitleaks/gitleaks#configuration

title = "Gitleaks config"

# Extend the default rules (don't replace them)
[extend]
useDefault = true

# Paths to exclude from scanning
# These are dependency/build directories that contain
# test fixtures with fake secrets, not real leaks.
[allowlist]
  description = "Global allowlist"
  paths = [
    # Swift Package Manager
    '''\.build/''',
    '''\.swiftpm/''',

    # CocoaPods
    '''Pods/''',

    # Dependency checkouts and caches
    '''Carthage/Checkouts/''',
    '''vendor/''',
    '''node_modules/''',

    # Build artifacts
    '''DerivedData/''',
    '''build/''',
    '''dist/''',

    # Package lock files (contain hashes, not secrets)
    '''Package\.resolved$''',
    '''Podfile\.lock$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    '''pnpm-lock\.yaml$''',
    '''Gemfile\.lock$''',

    # Test fixtures that intentionally contain fake secrets
    '''(test|tests|spec|specs|__tests__)/.*fixtures?/''',
    '''(test|tests|spec|specs|__tests__)/.*mocks?/''',
    '''(test|tests|spec|specs|__tests__)/.*stubs?/''',
  ]

# Google's public webhook rotation enum is an API constant, not a credential.
# Match only this exact generated line; retain the inherited detection rule.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Public Interactions webhook revocation enum"
  condition = "AND"
  paths = ['''^Sources/GoogleGenerativeLanguageTypes/GeneratedSources/Types\+Components\+Schemas\.swift$''']
  regexTarget = "line"
  regexes = ['''^\s*case revokePreviousSecretsAfterH24 = "revoke_previous_secrets_after_h24"\s*$''']
